name: Uppdatera väder

on:
  schedule:
    - cron: '*/30 * * * *'   # var 30:e minut
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hämta väderprognos
        run: node scripts/update-weather.mjs
      - name: Committa om datan ändrats
        run: |
          if [[ -n "$(git status --porcelain data/weather.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/weather.json
            git commit -m "Uppdatera väder ($(date -u +%H:%M) UTC)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break || { echo "Push-krock, försök $i…"; sleep $((RANDOM % 5 + 2)); }
            done
          else
            echo "Ingen ändring i vädret."
          fi
