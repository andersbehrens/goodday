name: Uppdatera badtemperatur

on:
  schedule:
    - cron: '*/30 * * * *'   # var 30:e minut
  workflow_dispatch:           # går även att köra manuellt

permissions:
  contents: write

concurrency:
  group: badtemp
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hämta och konvertera badtemperatur
        run: node scripts/update-badtemp.mjs

      - name: Committa om datan ändrats
        run: |
          if [[ -n "$(git status --porcelain data/badtemp.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/badtemp.json
            git commit -m "Uppdatera badtemperatur ($(date -u +%H:%M) UTC)"
            git push
          else
            echo "Ingen ändring i badtemperatur."
          fi
